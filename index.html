<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,500;0,600;0,700&display=swap"
      rel="stylesheet" />
    <title>My_To-Do_List</title>
  </head>
  <body>
    <div class="container">
      <h1 class="title">TODO LIST</h1>
      <div class="nav-container">
        <div class="search-wrapper">
          <input type="search" class="input search" placeholder="Search note..." />
        </div>
        <div class="select" tabindex="0">
          <div class="selected">All</div>
          <div class="select-trigger">
            <img src="img/chevron-top.svg" />
          </div>
          <div class="select__dropdown">
            <div class="select__item">All</div>
            <div class="select__item">Complete</div>
            <div class="select__item">Incomplete</div>
          </div>
        </div>
        <div class="theme">
          <img src="img/moon.svg" alt="moon" />
        </div>
      </div>

      <ul class="list">
      </ul>
      <button class="add-task">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M10.5 22.4821C10.5 22.8796 10.658 23.2608 10.9393 23.5419C11.2206 23.823 11.6022 23.9809 12 23.9809C12.3978 23.9809 12.7794 23.823 13.0607 23.5419C13.342 23.2608 13.5 22.8796 13.5 22.4821V13.4892H22.5C22.8978 13.4892 23.2794 13.3313 23.5607 13.0503C23.842 12.7692 24 12.3879 24 11.9904C24 11.5929 23.842 11.2117 23.5607 10.9306C23.2794 10.6495 22.8978 10.4916 22.5 10.4916H13.5V1.4988C13.5 1.1013 13.342 0.72007 13.0607 0.43899C12.7794 0.157909 12.3978 0 12 0C11.6022 0 11.2206 0.157909 10.9393 0.43899C10.658 0.72007 10.5 1.1013 10.5 1.4988V10.4916H1.5C1.10218 10.4916 0.720644 10.6495 0.43934 10.9306C0.158035 11.2117 0 11.5929 0 11.9904C0 12.3879 0.158035 12.7692 0.43934 13.0503C0.720644 13.3313 1.10218 13.4892 1.5 13.4892H10.5V22.4821Z" fill="#F7F7F7"/>
          </svg>
      </button>
      <div class="modal-container">
        <div class="modal-form">
          <h2 class="modal-title">NEW NOTE</h2>
          <input type="text" class="input input-add" placeholder="Input your note...">
          <div class="modal-btns">
            <button type="button" class="modal-btn cancel">CANCEL</button>
            <button type="button" class="modal-btn apply">APPLY</button>
          </div>
        </div>
      </div>
        <button type="button" class="undo-btn">
          <div class="timer">
            <svg class="timer-svg" width="32" height="32">
              <circle
                class="bg"
                cx="16"
                cy="16"
                r="14"
              />
              <circle
                class="progress"
                cx="16"
                cy="16"
                r="14"
              />
            </svg>
            <span class="undo-count"></span>
          </div>
          <span class="undo-text">UNDO</span>
          <img src="img/undo.svg">
        </button>
    </div>

    <div class="tabs">
      <button class="tab" data-tab="1">Tab1</button>
  
      <button class="tab" data-tab="2">
        Tab2
        <span class="icon">✓</span>
      </button>
  
      <button class="tab" data-tab="3">
        Tab3
        <span class="badge">1</span>
      </button>
  
      <button class="tab" data-tab="4">Tab4</button>
      <button class="tab" data-tab="5">Tab5</button>
    </div>
  
    <div class="content">
      <div class="panel" data-tab="1">
        Контент первой вкладки
      </div>
  
      <div class="panel" data-tab="2">
        Контент второй вкладки
      </div>
  
      <div class="panel" data-tab="3">
        Контент третьей вкладки
      </div>
  
      <div class="panel" data-tab="4">
        Контент четвертой вкладки
      </div>
  
      <div class="panel" data-tab="5">
        Контент пятой вкладки
      </div>
    </div>
    

    <script src="main.js"></script>
  </body>
</html>
